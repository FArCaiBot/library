 */

plugins {
    // Apply the java-library plugin for API and implementation separation.
    id 'java-library'
    id 'com.vanniktech.maven.publish' version '0.36.0'
}

base {
    archivesName = 'masking-library'
}

description = 'Reusable data masking library'

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit test framework.
    testImplementation libs.junit

    // This dependency is exported to consumers, that is to say found on their compile classpath.
    api libs.commons.math3

    // This dependency is used internally, and not exposed to consumers on their own compile classpath.
    implementation libs.guava
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

mavenPublishing {
    publishToMavenCentral()
    signAllPublications()

    coordinates(
        project.group.toString(),
        'masking-library',
        project.version.toString()
    )

    pom {
        name = 'masking-library'
        description = project.description
        url = 'https://github.com/FArCaiBot/library'
        inceptionYear = '2026'

        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }

        developers {
            developer {
                id = 'FArCaiBot'
                name = 'FArCaiBot'
                url = 'https://github.com/FArCaiBot/'
            }
        }

        scm {
            url = 'https://github.com/FArCaiBot/library'
            connection = 'scm:git:git://github.com/FArCaiBot/library.git'
            developerConnection = 'scm:git:ssh://git@github.com/FArCaiBot/library.git'
        }
    }
}
